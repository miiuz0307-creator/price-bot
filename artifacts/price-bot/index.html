<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B3834" />
    <script>
      // Apply the saved/system theme before first paint (no white flash).
      (function () {
        try {
          var choice = localStorage.getItem('theme');
          var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
    </script>
    <title>מחירון בוואטסאפ</title>
    <meta name="description" content="מערכת ניהול לבוט המחירון בוואטסאפ" />

    <meta property="og:title" content="מחירון בוואטסאפ" />
    <meta property="og:description" content="מערכת ניהול לבוט המחירון בוואטסאפ" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
