name: CI

# Every push and pull request:
#   1. generate  – regenerates API client/validators from openapi.yaml and runs the
#                  bot-reply golden-master test against a real PostgreSQL.
#                  On work branches, generated files/snapshots are committed back;
#                  on main they must already be up to date.
#   2. check     – typecheck, unit tests, production builds.
#   3. docker    – builds the deployable image.
# A red ✗ on GitHub means "do not deploy this version".
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.28.0

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricebot
      SESSION_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: production
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate API client and validators
        run: scripts/ci/run.sh "Codegen" pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - name: Bot reply golden master
        run: scripts/ci/run.sh "Bot replies" pnpm --filter @workspace/api-server run test:integration
        env:
          # Intentional reply changes: put [update-snapshot] in the commit message (work branches only),
          # then review the committed snapshot diff.
          UPDATE_SNAPSHOT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-snapshot]') && '1' || '' }}
      - name: Migrations produce exactly the TypeScript schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database pushed"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pushed DB_AUTO_MIGRATE=0 \
            scripts/ci/run.sh "drizzle push (reference schema)" pnpm --filter @workspace/db run setup-test-db
          scripts/ci/run.sh "Schema drift: migrations vs schema.ts" scripts/ci/schema-diff.sh \
            postgresql://postgres:postgres@localhost:5432/pricebot postgresql://postgres:postgres@localhost:5432/pushed
      - name: Commit generated files (work branches)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate API client / snapshots [ci]"
            git push
            echo "::notice title=Generated files committed::$(git log -1 --stat --format='%h' | tr '\n' ' ')"
          fi
      - name: Generated files must be committed (main / PRs)
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Stale generated files::$(git status --porcelain | tr '\n' ' ')"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: generate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: scripts/ci/run.sh "Typecheck" pnpm run typecheck
      - name: Unit tests
        run: scripts/ci/run.sh "Unit tests" pnpm --filter @workspace/api-server run test
      - name: Build API server
        run: scripts/ci/run.sh "Build API" pnpm --filter @workspace/api-server run build
      - name: Build web app
        run: scripts/ci/run.sh "Build web" pnpm --filter @workspace/price-bot run build
        env:
          NODE_ENV: production
          BASE_PATH: /

  screenshots:
    # Visual check of every screen (desktop/phone). Runs on work branches when the
    # commit message contains [screenshots]; images are committed to docs/screenshots.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricebot
      SESSION_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: production
      PORT: 8080
      OWNER_INITIAL_CODE: "2468"
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/price-bot run build
      - name: Start server
        run: |
          WHATSAPP_AUTH_DIR=$RUNNER_TEMP/wa node artifacts/api-server/dist/index.mjs > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/healthz && break; sleep 1; done
      - name: Seed demo data
        run: scripts/ci/run.sh "Seed demo data" scripts/ci/seed-demo.sh
      - name: Screenshots
        run: |
          mkdir -p $RUNNER_TEMP/pw && cd $RUNNER_TEMP/pw && npm init -y >/dev/null && npm i playwright@1.55.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/scripts/ci/screenshots.mjs $RUNNER_TEMP/pw/
          cd $GITHUB_WORKSPACE && OUT_DIR=$GITHUB_WORKSPACE/docs/screenshots SCHEMES=light,dark \
            scripts/ci/run.sh "Screenshots" node $RUNNER_TEMP/pw/screenshots.mjs
      - name: Server log on failure
        if: failure()
        run: echo "::error title=Server log::$(tail -n 60 $RUNNER_TEMP/server.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
      - name: Commit screenshots
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF#refs/heads/}" || true
          git add docs/screenshots
          git diff --cached --quiet || { git commit -m "docs: UI screenshots [ci]"; git push; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: price-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
