name: CI

# Every push and pull request:
#   1. generate  – regenerates API client/validators from openapi.yaml and runs the
#                  bot-reply golden-master test against a real PostgreSQL.
#                  On work branches, generated files/snapshots are committed back;
#                  on main they must already be up to date.
#   2. check     – typecheck, unit tests, production builds.
#   3. docker    – builds the deployable image.
# A red ✗ on GitHub means "do not deploy this version".
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.28.0

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricebot
      SESSION_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: production
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate API client and validators
        run: scripts/ci/run.sh "Codegen" pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - name: Create database schema
        run: scripts/ci/run.sh "Database schema" pnpm --filter @workspace/db run setup-test-db
      - name: Bot reply golden master
        run: scripts/ci/run.sh "Bot replies" pnpm --filter @workspace/api-server run test:integration
      - name: Commit generated files (work branches)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate API client / snapshots [ci]"
            git push
            echo "::notice title=Generated files committed::$(git log -1 --stat --format='%h' | tr '\n' ' ')"
          fi
      - name: Generated files must be committed (main / PRs)
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Stale generated files::$(git status --porcelain | tr '\n' ' ')"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: generate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: scripts/ci/run.sh "Typecheck" pnpm run typecheck
      - name: Unit tests
        run: scripts/ci/run.sh "Unit tests" pnpm --filter @workspace/api-server run test
      - name: Build API server
        run: scripts/ci/run.sh "Build API" pnpm --filter @workspace/api-server run build
      - name: Build web app
        run: scripts/ci/run.sh "Build web" pnpm --filter @workspace/price-bot run build
        env:
          NODE_ENV: production
          BASE_PATH: /

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: price-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
