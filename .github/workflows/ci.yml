name: CI

# Every push and pull request:
#   1. generate  – regenerates API client/validators from openapi.yaml and runs the
#                  bot-reply golden-master test against a real PostgreSQL.
#                  On work branches, generated files/snapshots are committed back;
#                  on main they must already be up to date.
#   2. check     – typecheck, unit tests, production builds.
#   3. docker    – builds the deployable image.
#   4. android   – (commit message with [apk], or manual run) builds the phone app
#                  APK and publishes it as a GitHub release.
# Commit-message flags on work branches: [update-lockfile] refreshes pnpm-lock.yaml
# after package.json changes; [update-snapshot] re-records bot replies;
# [screenshots] captures website + mobile app screenshots.
# A red ✗ on GitHub means "do not deploy this version".
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      apk:
        description: Build the Android app (APK) and publish it as a release
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.28.0

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricebot
      SESSION_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: production
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ "$UPDATE_LOCKFILE" = "1" ]; then
            scripts/ci/run.sh "pnpm install (lockfile update)" pnpm install --no-frozen-lockfile
            node scripts/ci/align-expo.mjs
            git diff --quiet artifacts/price-bot-mobile/package.json || scripts/ci/run.sh "pnpm install (aligned Expo versions)" pnpm install --no-frozen-lockfile
          else
            scripts/ci/run.sh "pnpm install" pnpm install --frozen-lockfile
          fi
        env:
          UPDATE_LOCKFILE: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-lockfile]') && '1' || '' }}
      - name: Expo package versions match the SDK
        continue-on-error: true
        working-directory: artifacts/price-bot-mobile
        run: |
          out="$(pnpm exec expo install --check 2>&1)" && echo "$out" || {
            echo "$out"
            echo "::warning title=Expo versions::$(echo "$out" | tail -n 25 | sed -e 's/\x1b\[[0-9;]*m//g' | awk 'BEGIN{ORS="%0A"} {print}')"
          }
      - name: Regenerate API client and validators
        run: scripts/ci/run.sh "Codegen" pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - name: Bot reply golden master
        run: scripts/ci/run.sh "Bot replies" pnpm --filter @workspace/api-server run test:integration
        env:
          # Intentional reply changes: put [update-snapshot] in the commit message (work branches only),
          # then review the committed snapshot diff.
          UPDATE_SNAPSHOT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-snapshot]') && '1' || '' }}
      - name: Migrations produce exactly the TypeScript schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database pushed"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pushed DB_AUTO_MIGRATE=0 \
            scripts/ci/run.sh "drizzle push (reference schema)" pnpm --filter @workspace/db run setup-test-db
          scripts/ci/run.sh "Schema drift: migrations vs schema.ts" scripts/ci/schema-diff.sh \
            postgresql://postgres:postgres@localhost:5432/pricebot postgresql://postgres:postgres@localhost:5432/pushed
      - name: Commit generated files (work branches)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate API client / snapshots / lockfile [ci]"
            git push
            echo "::notice title=Generated files committed::$(git log -1 --stat --format='%h' | tr '\n' ' ')"
          fi
      - name: Generated files must be committed (main / PRs)
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Stale generated files::$(git status --porcelain | tr '\n' ' ')"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: generate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: scripts/ci/run.sh "Typecheck" pnpm run typecheck
      - name: Unit tests
        run: scripts/ci/run.sh "Unit tests" pnpm --filter @workspace/api-server run test
      - name: Build API server
        run: scripts/ci/run.sh "Build API" pnpm --filter @workspace/api-server run build
      - name: Build web app
        run: scripts/ci/run.sh "Build web" pnpm --filter @workspace/price-bot run build
        env:
          NODE_ENV: production
          BASE_PATH: /

  screenshots:
    # Visual check of every screen (desktop/phone). Runs on work branches when the
    # commit message contains [screenshots]; images are committed to docs/screenshots.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricebot
      SESSION_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: production
      PORT: 8080
      OWNER_INITIAL_CODE: "2468"
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/price-bot run build
      - name: Start server
        run: |
          WHATSAPP_AUTH_DIR=$RUNNER_TEMP/wa node artifacts/api-server/dist/index.mjs > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/healthz && break; sleep 1; done
      - name: Seed demo data
        run: scripts/ci/run.sh "Seed demo data" scripts/ci/seed-demo.sh
      - name: Screenshots
        run: |
          mkdir -p $RUNNER_TEMP/pw && cd $RUNNER_TEMP/pw && npm init -y >/dev/null && npm i playwright@1.55.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/scripts/ci/screenshots.mjs $RUNNER_TEMP/pw/
          cd $GITHUB_WORKSPACE && OUT_DIR=$GITHUB_WORKSPACE/docs/screenshots SCHEMES=light,dark \
            scripts/ci/run.sh "Screenshots" node $RUNNER_TEMP/pw/screenshots.mjs
      - name: Mobile app screenshots (web build of the phone app)
        run: |
          cd artifacts/price-bot-mobile && EXPO_PUBLIC_API_URL= pnpm exec expo export --platform web --output-dir dist-web > $RUNNER_TEMP/expo-export.log 2>&1 || { tail -n 80 $RUNNER_TEMP/expo-export.log; echo "::error title=Expo web export failed::$(tail -n 40 $RUNNER_TEMP/expo-export.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1; }
          cd $GITHUB_WORKSPACE
          node scripts/ci/serve-app.mjs > $RUNNER_TEMP/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/ >/dev/null && break; sleep 1; done
          cp scripts/ci/app-screenshots.mjs $RUNNER_TEMP/pw/
          OUT_DIR=$GITHUB_WORKSPACE/docs/screenshots/app scripts/ci/run.sh "App screenshots" node $RUNNER_TEMP/pw/app-screenshots.mjs
      - name: Server log on failure
        if: failure()
        run: echo "::error title=Server log::$(tail -n 60 $RUNNER_TEMP/server.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
      - name: Commit screenshots
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF#refs/heads/}" || true
          git add docs/screenshots
          git diff --cached --quiet || { git commit -m "docs: UI screenshots [ci]"; git push; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: price-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    # Phone app for direct install (no store): signed APK published as a GitHub release.
    # Every build uses the same signing key, so a new APK installs over the old one.
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk]')) || (github.event_name == 'workflow_dispatch' && inputs.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-
      # Flat node_modules: what React Native's Gradle build expects.
      - run: scripts/ci/run.sh "pnpm install (hoisted)" pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Firebase config for push notifications (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > artifacts/price-bot-mobile/google-services.json
            echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
            echo "::notice title=Push::Firebase config found – push notifications enabled in this build"
          else
            echo "::notice title=Push::No GOOGLE_SERVICES_JSON secret – app built without push notifications"
          fi
      - name: Generate native Android project
        working-directory: artifacts/price-bot-mobile
        run: CI=1 ../../scripts/ci/run.sh "expo prebuild" pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build signed APK
        working-directory: artifacts/price-bot-mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/artifacts/price-bot-mobile/credentials/android.keystore \
            -Pandroid.injected.signing.store.password=pricebot-sideload \
            -Pandroid.injected.signing.key.alias=pricebot \
            -Pandroid.injected.signing.key.password=pricebot-sideload 2>&1 | tee $RUNNER_TEMP/gradle.log || {
            { grep -n -A25 "What went wrong" $RUNNER_TEMP/gradle.log; grep -n -i -B2 -A8 "error:\|SyntaxError\|Unable to resolve" $RUNNER_TEMP/gradle.log | head -80; } > $RUNNER_TEMP/gradle-errors.txt
            echo "::error title=Gradle build failed::$(head -c 6000 $RUNNER_TEMP/gradle-errors.txt | sed -e 's/%/%25/g' -e 's/\x1b\[[0-9;]*m//g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          }
      - name: Keep the phone APK
        run: cp artifacts/price-bot-mobile/android/app/build/outputs/apk/release/app-release.apk $RUNNER_TEMP/phone.apk
      # Smoke test on an Android emulator (x86_64 build of the same code): the app must
      # start, show the sign-in screen and not crash. Nothing is sent to the real server.
      # Test server with demo data, reachable from the emulator through `adb reverse`.
      - name: Start test server with demo data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricebot
          SESSION_SECRET: ci-only-secret-not-used-in-production
          NODE_ENV: production
          PORT: 8080
          OWNER_INITIAL_CODE: "2468"
          TZ: Asia/Jerusalem
          APP_UPDATE_TOKEN: ci-only-update-token-0123456789abcdef
          APP_UPDATES_DIR: ${{ runner.temp }}/app-updates
        run: |
          pnpm --filter @workspace/api-server run build > $RUNNER_TEMP/api-build.log 2>&1 || { tail -n 40 $RUNNER_TEMP/api-build.log; exit 1; }
          WHATSAPP_AUTH_DIR=$RUNNER_TEMP/wa nohup node artifacts/api-server/dist/index.mjs > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/healthz >/dev/null && break; sleep 1; done
          scripts/ci/run.sh "Seed demo data" scripts/ci/seed-demo.sh
      - name: Build emulator APK (x86_64, talks to the test server)
        working-directory: artifacts/price-bot-mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: |
          # Test build only: allow plain http to the local test server, and take
          # online updates from it.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' app/src/main/AndroidManifest.xml
          sed -i 's#https://price-bot-production-2674.up.railway.app/api/app-updates/manifest#http://localhost:8080/api/app-updates/manifest#' app/src/main/AndroidManifest.xml
          grep -q "localhost:8080/api/app-updates" app/src/main/AndroidManifest.xml || { echo "::error title=OTA test::update URL not found in AndroidManifest"; exit 1; }
          ./gradlew createBundleReleaseJsAndAssets --rerun assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/artifacts/price-bot-mobile/credentials/android.keystore \
            -Pandroid.injected.signing.store.password=pricebot-sideload \
            -Pandroid.injected.signing.key.alias=pricebot \
            -Pandroid.injected.signing.key.password=pricebot-sideload > $RUNNER_TEMP/gradle-x86.log 2>&1 || { tail -n 60 $RUNNER_TEMP/gradle-x86.log; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk $RUNNER_TEMP/emulator.apk
      - name: Export an online update for the emulator test
        working-directory: artifacts/price-bot-mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
        run: |
          pnpm exec expo export --platform android --output-dir $RUNNER_TEMP/ota-test > $RUNNER_TEMP/ota-export.log 2>&1 || { tail -n 40 $RUNNER_TEMP/ota-export.log; exit 1; }
          pnpm exec expo config --type public --json > $RUNNER_TEMP/ota-config.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: OTA_DIR=$RUNNER_TEMP/ota-test OTA_CONFIG=$RUNNER_TEMP/ota-config.json APP_UPDATE_TOKEN=ci-only-update-token-0123456789abcdef bash scripts/ci/android-smoke.sh $RUNNER_TEMP/emulator.apk docs/screenshots/app/android
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.${{ github.run_number }}"
          apk="$RUNNER_TEMP/mechiron-$version.apk"
          cp $RUNNER_TEMP/phone.apk "$apk"
          size=$(du -h "$apk" | cut -f1)
          cat > $RUNNER_TEMP/notes.md <<NOTES
          ## אפליקציית מחירון לאנדרואיד – גרסה $version

          **התקנה:** פותחים את הקישור לקובץ \`mechiron-$version.apk\` מהטלפון (מחוברים ל־GitHub) ← הורדה ← פתיחה ← „התקנה”.
          בפעם הראשונה הטלפון יבקש לאשר התקנה מהדפדפן („מקורות לא ידועים”) – מאשרים וחוזרים.
          עדכון: מתקינים את הגרסה החדשה מעל הקיימת – הכניסה והנתונים נשמרים.

          גודל: $size · נבנה מ־${{ github.sha }}
          NOTES
          sed -i 's/^          //' $RUNNER_TEMP/notes.md
          gh release create "app-v$version" "$apk" --target "${{ github.sha }}" --title "מחירון לאנדרואיד $version" --notes-file $RUNNER_TEMP/notes.md --latest
          echo "::notice title=APK ready::https://github.com/${{ github.repository }}/releases/tag/app-v$version"
      - name: Commit emulator screenshot
        if: always() && github.ref != 'refs/heads/main'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF#refs/heads/}" || true
          git add docs/screenshots/app
          git diff --cached --quiet || { git commit -m "docs: Android emulator screenshots [ci]"; git push; }

  ota:
    # Online update of the phone app: every change on main that passes the checks is
    # published to the server; installed apps pick it up on their next launch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    permissions:
      contents: read
      id-token: write   # GitHub-signed proof that this is the main branch of this repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/ci/run.sh "pnpm install (hoisted)" pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Export and publish the update
        env:
          MESSAGE: ${{ github.sha }}
        run: |
          export APP_UPDATE_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=price-bot-updates" | jq -r .value)
          [ -n "$APP_UPDATE_TOKEN" ] && [ "$APP_UPDATE_TOKEN" != null ] || { echo "::error title=Online update::could not get a GitHub OIDC token"; exit 1; }
          cd artifacts/price-bot-mobile
          pnpm exec expo export --platform android --output-dir $RUNNER_TEMP/ota > $RUNNER_TEMP/ota-export.log 2>&1 || { tail -n 40 $RUNNER_TEMP/ota-export.log; exit 1; }
          pnpm exec expo config --type public --json > $RUNNER_TEMP/ota-config.json
          url=$(node -p "require('./app.json').expo.updates.url.replace('/api/app-updates/manifest','')")
          cd $GITHUB_WORKSPACE
          UPDATE_URL=$url scripts/ci/run.sh "Publish online update" node scripts/ci/publish-update.mjs $RUNNER_TEMP/ota $RUNNER_TEMP/ota-config.json
          echo "::notice title=Online update published::installed apps update on their next launch"
