name: CI

# Runs on every push and pull request: install, typecheck, tests (including bot
# replies against a real PostgreSQL), production build, and a Docker image build.
# A red ✗ on GitHub means "do not deploy this version".
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_golden:
        description: "Re-record golden bot replies (only after an intentional reply change)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash -o pipefail {0}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pricebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/pricebot_test
      SESSION_SECRET: ci-only-secret-not-used-in-production
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Typecheck (all packages)
        run: pnpm run typecheck 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Unit tests
        run: pnpm --filter @workspace/api-server run test 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Create test database schema
        run: pnpm --filter @workspace/db run push-force 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Bot reply tests (golden)
        run: pnpm --filter @workspace/api-server run test:integration 2>&1 | tee "$RUNNER_TEMP/step.log"
        env:
          UPDATE_GOLDEN: ${{ inputs.update_golden && '1' || '' }}
      - name: Save newly recorded golden replies
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain artifacts/api-server/src/tests/golden)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/api-server/src/tests/golden
            git commit -m "test: record golden bot replies"
            git push
            echo "::notice title=Golden replies recorded::Committed artifacts/api-server/src/tests/golden"
          fi
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Build web app
        run: pnpm --filter @workspace/price-bot run build 2>&1 | tee "$RUNNER_TEMP/step.log"
        env:
          NODE_ENV: production
          BASE_PATH: /
      - name: Report failure
        if: failure()
        run: .github/scripts/report-failure.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: price-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
